services:
  db:
    image: postgres:16-alpine
    container_name: karimi-gold-gallery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: karimi_gold
    ports:
      - "5432:5432"
    volumes:
      - karimi_gold_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karimi_gold"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  karimi_gold_pgdata:
